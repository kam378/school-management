<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forbidden (403)</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #fff3cd; color: #856404; }
        h1 { font-size: 2em; }
        p { font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Access Denied (403)</h1>
    <p>You do not have permission to view this page.</p>
    {% if message %}
    <p>{{ message }}</p>
    {% endif %}
    <a href="/">Go Home</a>
</body>
</html>
