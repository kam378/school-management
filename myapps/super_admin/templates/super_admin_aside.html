{% load static %}
<!-- Brand Area -->
<div class="brand-section" style="margin-bottom: 2.5rem; padding: 0 0.5rem; display: flex; align-items: center; gap: 1rem;">
    <div style="width: 2.75rem; height: 2.75rem; background: var(--primary-color); border-radius: 1rem; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); flex-shrink: 0;">
        {% if global_settings.logo %}
            <img src="{{ global_settings.logo.url }}" style="height: 1.5rem; width: 1.5rem; object-fit: contain;">
        {% else %}
            <i class="fa fa-shield-halved" style="font-size: 1.25rem;"></i>
        {% endif %}
    </div>
    <div style="overflow: hidden;">
        <div style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; color: var(--primary-color); line-height: 1; margin-bottom: 0.25rem;">Infrastructure</div>
        <div style="font-size: 0.875rem; font-weight: 800; color: {% if global_settings.is_dark_mode %}white{% else %}var(--text-color){% endif %}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Control Center</div>
    </div>
</div>

<!-- Navigation Menu -->
<nav class="nav-menu" style="flex: 1;">
    <a href="{% url 'super_admin_dashboard' %}" class="nav-link-sa {% if request.resolver_match.url_name == 'super_admin_dashboard' %}active{% endif %}">
        <i class="fa fa-chart-pie"></i>
        <span>Global Overview</span>
    </a>
    <a href="{% url 'super_admin_schools' %}" class="nav-link-sa {% if 'schools' in request.path %}active{% endif %}">
        <i class="fa fa-school"></i>
        <span>Manage Schools</span>
    </a>
    <a href="{% url 'super_admin_plans' %}" class="nav-link-sa {% if 'plans' in request.path %}active{% endif %}">
        <i class="fa fa-gem"></i>
        <span>Subscription Plans</span>
    </a>
    <a href="{% url 'system_settings' %}" class="nav-link-sa {% if 'settings' in request.path %}active{% endif %}">
        <i class="fa fa-sliders"></i>
        <span>System Settings</span>
    </a>
    <a href="{% url 'manage_platform_resources' %}" class="nav-link-sa {% if 'resources' in request.path %}active{% endif %}">
        <i class="fa fa-book-bookmark"></i>
        <span>Master Library</span>
    </a>
    <a href="{% url 'platform_audit_logs' %}" class="nav-link-sa {% if 'audit-logs' in request.path %}active{% endif %}">
        <i class="fa fa-fingerprint"></i>
        <span>Security Vault</span>
    </a>
    <a href="{% url 'super_admin_users' %}" class="nav-link-sa {% if 'users' in request.path %}active{% endif %}">
        <i class="fa fa-shield-user"></i>
        <span>Admin Control</span>
    </a>
</nav>

<!-- User Footer -->
<div class="user-footer" style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
    <div style="padding: 1rem; border-radius: 1.25rem; background: {% if global_settings.is_dark_mode %}rgba(255,255,255,0.03){% else %}rgba(0,0,0,0.02){% endif %}; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <div style="width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; background: linear-gradient(135deg, #6b7280, #374151); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.75rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                {{ request.user.username|first|upper }}
            </div>
            <div style="overflow: hidden; max-width: 100px;">
                <div style="font-size: 0.75rem; font-weight: 800; color: {% if global_settings.is_dark_mode %}white{% else %}var(--text-color){% endif %}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ request.user.username }}</div>
                <div style="font-size: 0.625rem; font-weight: 600; color: var(--muted-text); text-transform: uppercase; letter-spacing: 0.05em;">Root</div>
            </div>
        </div>
        <a href="{% url 'logout' %}" style="width: 2rem; height: 2rem; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; color: var(--muted-text); transition: all 0.2s ease; text-decoration: none;" onmouseover="this.style.color='#ef4444'; this.style.background='rgba(239, 68, 68, 0.1)'" onmouseout="this.style.color='var(--muted-text)'; this.style.background='transparent'">
            <i class="fa fa-power-off" style="font-size: 0.875rem;"></i>
        </a>
    </div>
</div>
